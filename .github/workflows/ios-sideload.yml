# An unsigned iOS build, packaged as an .ipa, for sideloading tools (Sideloadly, AltStore) that sign it with your own
# Apple ID on the way onto the phone. Started by hand (Actions tab or the workflow_dispatch API) or by pushing a tag
# named build-*. The .ipa is attached to a GitHub Release (tag ipa-<run number>) and kept as a run artifact.
name: iOS sideload IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install node modules
        run: npm ci

      - name: Check the game rules
        run: npm test

      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: ./ios
        run: pod install

      - name: Build the app, unsigned
        working-directory: ./ios
        run: |
          set -eo pipefail
          WS=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Building scheme $SCHEME from $WS"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the .ipa
        working-directory: ./ios
        run: |
          set -eo pipefail
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          echo "Packaging $APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry ../Hatchlore-unsigned.ipa Payload
          ls -la ../Hatchlore-unsigned.ipa

      - name: Keep it as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hatchlore-unsigned-ipa
          path: Hatchlore-unsigned.ipa
          retention-days: 30

      - name: Attach it to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ipa-${{ github.run_number }}" Hatchlore-unsigned.ipa \
            --title "Sideload IPA #${{ github.run_number }}" \
            --notes "Unsigned build of ${{ github.sha }} for Sideloadly / AltStore." \
            --target "${{ github.sha }}"
